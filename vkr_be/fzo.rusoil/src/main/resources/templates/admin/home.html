<div th:fragment="content">
  <style>
    .dash { padding: 1.5rem; max-width: 900px; margin: 0 auto; }
    .dash-header { margin-bottom: 1.5rem; }
    .dash-header h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; color: #1E3A5F; }
    .dash-header p  { font-size: 14px; color: #666; margin: 0; }
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }
    .dash-card {
      background: #fff;
      border: 1px solid #e8edf2;
      border-radius: 14px;
      padding: 1.25rem;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .dash-card:hover {
      border-color: #b0c4de;
      box-shadow: 0 4px 14px rgba(30,58,95,0.1);
    }
    .dash-card__icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .dash-card__title { font-size: 15px; font-weight: 600; color: #1E3A5F; margin: 0; }
    .dash-card__desc  { font-size: 13px; color: #666; margin: 0; line-height: 1.5; }
    .dash-card__arrow { font-size: 13px; color: #999; margin-top: auto; }
  </style>

  <div class="dash">
    <div class="dash-header">
      <h1>ФЗО — панель управления</h1>
      <p>Быстрый доступ к разделам сайта</p>
    </div>

    <div class="dash-grid">
      <a href="/admin/news/index" class="dash-card">
        <p class="dash-card__title">Новости</p>
        <p class="dash-card__desc">Добавление и редактирование новостей</p>
        <span class="dash-card__arrow">Перейти </span>
      </a>
      <a href="/admin/cards/index" class="dash-card">
        <p class="dash-card__title">Карточки</p>
        <p class="dash-card__desc">Управление карточками направлений</p>
        <span class="dash-card__arrow">Перейти </span>
      </a>
      <a href="/admin/excel" class="dash-card">
        <p class="dash-card__title">Таблицы</p>
        <p class="dash-card__desc">Загрузка и управление Excel-файлами</p>
        <span class="dash-card__arrow">Перейти</span>
      </a>
      <a href="/admin/documents" class="dash-card">
        <p class="dash-card__title">Документы</p>
        <p class="dash-card__desc">Загрузка документов для студентов</p>
        <span class="dash-card__arrow">Перейти </span>
      </a>
    </div>
  </div>
</div>
