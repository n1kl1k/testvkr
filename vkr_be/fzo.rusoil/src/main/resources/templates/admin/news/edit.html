<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать новость</title>

    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <link href="https://unpkg.com/quill-better-table@1.2.4/dist/quill-better-table.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>
        body {
            background: #446693;
            font-family: sans-serif;
            padding: 0;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            margin: 30px auto;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .editor-label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        #editorShort {
            height: 150px;
            margin-bottom: 40px;
        }
        #editorFull {
            height: 300px;
            margin-bottom: 40px;
        }
        button[type="submit"] {
            padding: 10px 20px;
            background: #1E3A5F;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container">
    <h2>Редактирование новости</h2>

    <form th:action="@{/admin/news/update/{id}(id=${news.id})}"
          method="post"
          onsubmit="prepareData()">

        <input type="hidden" name="_csrf" th:value="${_csrf.token}">

        <input type="text" name="title" th:value="${news.title}" required>

        <input type="hidden" name="shortText" id="shortTextHidden">
        <label class="editor-label">Краткий текст (с форматированием):</label>
        <div id="editorShort" th:data-shorttext="${news.shortText}"></div>

        <input type="hidden" name="fullText" id="fullTextHidden">
        <label class="editor-label">Полный текст (с форматированием):</label>
        <div id="editorFull" th:data-fulltext="${news.fullText}"></div>

        <button type="submit">💾 Обновить</button>
    </form>
</div>

<script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://unpkg.com/quill-better-table@1.2.4/dist/quill-better-table.js"></script>
<script>
    Quill.register({ 'modules/better-table': quillBetterTable }, true);

    const toolbarOptions = [
        [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
        [{ 'font': [] }],
        [{ 'size': ['small', false, 'large', 'huge'] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'color': [] }, { 'background': [] }],
        [{ 'script': 'sub' }, { 'script': 'super' }],
        ['blockquote', 'code-block'],
        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
        [{ 'indent': '-1' }, { 'indent': '+1' }],
        [{ 'align': [] }],
        ['link', 'image', 'video', 'formula'],
        ['clean'],
        ['table']
    ];

    function makeConfig(handler) {
        return {
            theme: 'snow',
            modules: {
                toolbar: {
                    container: toolbarOptions,
                    handlers: {
                        table: handler
                    }
                },
                'better-table': {
                    operationMenu: {
                        items: {
                            insertColumnRight: { text: 'Добавить столбец справа' },
                            insertColumnLeft:  { text: 'Добавить столбец слева' },
                            insertRowUp:       { text: 'Добавить строку выше' },
                            insertRowDown:     { text: 'Добавить строку ниже' },
                            mergeCells:        { text: 'Объединить ячейки' },
                            unmergeCells:      { text: 'Разъединить ячейки' },
                            deleteColumn:      { text: 'Удалить столбец' },
                            deleteRow:         { text: 'Удалить строку' },
                            deleteTable:       { text: 'Удалить таблицу' },
                        }
                    }
                },
                keyboard: { bindings: quillBetterTable.keyboardBindings }
            }
        };
    }

    const shortQuill = new Quill('#editorShort', makeConfig(function() {
        this.quill.getModule('better-table').insertTable(3, 3);
    }));

    const fullQuill = new Quill('#editorFull', makeConfig(function() {
        this.quill.getModule('better-table').insertTable(3, 3);
    }));

    // Заполняем сохранённым HTML
    const initialShortHtml = document.getElementById('editorShort').getAttribute('data-shorttext') || '';
    const initialFullHtml  = document.getElementById('editorFull').getAttribute('data-fulltext')  || '';

    shortQuill.clipboard.dangerouslyPasteHTML(initialShortHtml);
    fullQuill.clipboard.dangerouslyPasteHTML(initialFullHtml);

    function prepareData() {
        document.getElementById('shortTextHidden').value = shortQuill.root.innerHTML;
        document.getElementById('fullTextHidden').value  = fullQuill.root.innerHTML;
    }
</script>

</body>
</html>
