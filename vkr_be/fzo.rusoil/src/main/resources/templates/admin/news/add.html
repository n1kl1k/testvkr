<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить новость</title>

    <!-- Quill -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">

    <!-- Better Table -->
    <link href="https://unpkg.com/quill-better-table@1.2.4/dist/quill-better-table.css" rel="stylesheet">

    <!-- KaTeX -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>
        body {
            background: #446693;
            font-family: sans-serif;
            padding: 0;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 900px;
            margin: 30px auto;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .editor-label {
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        #editorShort {
            height: 200px;
            margin-bottom: 40px;
        }

        #editorFull {
            height: 350px;
            margin-bottom: 40px;
        }

        button[type="submit"] {
            padding: 10px 20px;
            background: #1E3A5F;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .table-btn {
            margin-bottom: 10px;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: #2f5b8a;
            color: white;
            cursor: pointer;
        }

        .ql-editor {
            min-height: 150px;
        }
    </style>
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container">

    <h2>Добавить новость</h2>

    <form th:action="@{/admin/news/save}"
          method="post"
          onsubmit="prepareData()">

        <input type="hidden"
               name="_csrf"
               th:value="${_csrf.token}">

        <!-- Заголовок -->
        <input type="text"
               name="title"
               placeholder="Заголовок"
               required>

        <!-- Краткий текст -->
        <input type="hidden"
               name="shortText"
               id="shortTextHidden">

        <label class="editor-label">
            Краткий текст:
        </label>

        <button type="button"
                class="table-btn"
                id="insert-table-short">
            ➕ Таблица
        </button>

        <div id="editorShort"></div>

        <!-- Полный текст -->
        <input type="hidden"
               name="fullText"
               id="fullTextHidden">

        <label class="editor-label">
            Полный текст:
        </label>

        <button type="button"
                class="table-btn"
                id="insert-table-full">
            ➕ Таблица
        </button>

        <div id="editorFull"></div>

        <button type="submit">
            💾 Сохранить
        </button>

    </form>
</div>

<!-- Quill -->
<script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>

<!-- KaTeX -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<!-- Better Table -->
<script src="https://unpkg.com/quill-better-table@1.2.4/dist/quill-better-table.js"></script>

<script>

    // Регистрация better-table
    Quill.register({
        'modules/better-table': quillBetterTable
    }, true);

    // Toolbar
    const toolbarOptions = [
        [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
        [{ 'font': [] }],
        [{ 'size': ['small', false, 'large', 'huge'] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'color': [] }, { 'background': [] }],
        [{ 'script': 'sub' }, { 'script': 'super' }],
        ['blockquote', 'code-block'],
        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
        [{ 'indent': '-1' }, { 'indent': '+1' }],
        [{ 'align': [] }],
        ['link', 'image', 'video', 'formula']
    ];

    // Конфиг редактора
    function makeConfig() {

        return {

            theme: 'snow',

            modules: {

                toolbar: toolbarOptions,

                'better-table': {

                    operationMenu: {

                        items: {

                            insertColumnRight: {
                                text: 'Добавить столбец справа'
                            },

                            insertColumnLeft: {
                                text: 'Добавить столбец слева'
                            },

                            insertRowUp: {
                                text: 'Добавить строку выше'
                            },

                            insertRowDown: {
                                text: 'Добавить строку ниже'
                            },

                            mergeCells: {
                                text: 'Объединить ячейки'
                            },

                            unmergeCells: {
                                text: 'Разъединить ячейки'
                            },

                            deleteColumn: {
                                text: 'Удалить столбец'
                            },

                            deleteRow: {
                                text: 'Удалить строку'
                            },

                            deleteTable: {
                                text: 'Удалить таблицу'
                            }
                        }
                    }
                },

                keyboard: {
                    bindings: quillBetterTable.keyboardBindings
                }
            }
        };
    }

    // Создание редакторов
    const shortQuill = new Quill(
        '#editorShort',
        makeConfig()
    );

    const fullQuill = new Quill(
        '#editorFull',
        makeConfig()
    );

    shortQuill.setText('\n');
    fullQuill.setText('\n');
    // Кнопка таблицы (краткий текст)
    document
        .getElementById('insert-table-short')
        .addEventListener('click', function () {
            shortQuill.focus();
            shortQuill
                .getModule('better-table')
                .insertTable(3, 3);
        });

    // Кнопка таблицы (полный текст)
    document
        .getElementById('insert-table-full')
        .addEventListener('click', function () {

            fullQuill
                .getModule('better-table')
                .insertTable(3, 3);
        });

    // Отправка HTML в hidden input
    function prepareData() {

        document.getElementById('shortTextHidden').value =
            shortQuill.root.innerHTML;

        document.getElementById('fullTextHidden').value =
            fullQuill.root.innerHTML;
    }

</script>

</body>
</html>
