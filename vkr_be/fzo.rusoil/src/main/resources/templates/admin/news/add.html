<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Добавить новость</title>

    <!-- QUILL 2 -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css"
          rel="stylesheet">

    <!-- TABLE BETTER -->
    <link href="https://cdn.jsdelivr.net/npm/quill-table-better@1/dist/quill-table-better.css"
          rel="stylesheet">

    <!-- KATEX -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>

        body {
            background: #446693;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            background: white;
            max-width: 1000px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 25px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .editor-label {
            display: block;
            margin-top: 25px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #editorShort {
            height: 250px;
            margin-bottom: 40px;
        }

        #editorFull {
            height: 450px;
            margin-bottom: 40px;
        }

        .ql-editor {
            min-height: 200px;
            font-size: 16px;
        }

        button[type="submit"] {

            padding: 12px 20px;
            background: #1E3A5F;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

    </style>

</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container">

    <h2>Добавить новость</h2>

    <form th:action="@{/admin/news/save}"
          method="post"
          onsubmit="prepareData()">

        <!-- CSRF -->
        <input type="hidden"
               name="_csrf"
               th:value="${_csrf.token}">

        <!-- TITLE -->
        <input type="text"
               name="title"
               placeholder="Заголовок"
               required>

        <!-- SHORT TEXT -->
        <input type="hidden"
               name="shortText"
               id="shortTextHidden">

        <label class="editor-label">
            Краткий текст:
        </label>

        <div id="editorShort"></div>

        <!-- FULL TEXT -->
        <input type="hidden"
               name="fullText"
               id="fullTextHidden">

        <label class="editor-label">
            Полный текст:
        </label>

        <div id="editorFull"></div>

        <!-- SUBMIT -->
        <button type="submit">
            💾 Сохранить
        </button>

    </form>

</div>

<!-- QUILL 2 -->
<script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>

<!-- TABLE BETTER -->
<script src="https://cdn.jsdelivr.net/npm/quill-table-better@1/dist/quill-table-better.js"></script>

<!-- KATEX -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<script>

    /*
    ============================================
    REGISTRATION
    ============================================
    */

    Quill.register({
        'modules/table-better': QuillTableBetter
    }, true);

    /*
    ============================================
    TOOLBAR
    ============================================
    */

    const toolbarOptions = [

        [{ header: [1, 2, 3, 4, 5, 6, false] }],

        [{ font: [] }],

        [{ size: ['small', false, 'large', 'huge'] }],

        ['bold', 'italic', 'underline', 'strike'],

        [{ color: [] }, { background: [] }],

        [{ script: 'sub' }, { script: 'super' }],

        ['blockquote', 'code-block'],

        [{ list: 'ordered' }, { list: 'bullet' }],

        [{ indent: '-1' }, { indent: '+1' }],

        [{ align: [] }],

        ['link', 'image', 'video', 'formula'],

        ['table-better'],

        ['clean']
    ];

    /*
    ============================================
    CONFIG
    ============================================
    */

    function makeConfig() {

        return {

            theme: 'snow',

            modules: {

                toolbar: toolbarOptions,

                table: false,

                'table-better': {

                    language: 'en',

                    menus: [
                        'column',
                        'row',
                        'merge',
                        'table',
                        'cell',
                        'wrap',
                        'copy',
                        'delete'
                    ]
                },

                keyboard: {
                    bindings: QuillTableBetter.keyboardBindings
                }
            }
        };
    }

    /*
    ============================================
    CREATE EDITORS
    ============================================
    */

    const shortQuill = new Quill(
        '#editorShort',
        makeConfig()
    );

    const fullQuill = new Quill(
        '#editorFull',
        makeConfig()
    );

    /*
    ============================================
    SAVE HTML
    ============================================
    */

    function prepareData() {

        document.getElementById('shortTextHidden').value =
            shortQuill.root.innerHTML;

        document.getElementById('fullTextHidden').value =
            fullQuill.root.innerHTML;
    }

</script>

</body>
</html>
