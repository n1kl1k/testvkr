<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить новость</title>

    <!-- Quill -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">

    <!-- Better Table -->
    <link href="https://unpkg.com/quill-better-table@1.2.4/dist/quill-better-table.css"
          rel="stylesheet">

    <!-- KaTeX -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>

        body {
            background: #446693;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            background: white;
            max-width: 900px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        .editor-label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #editorShort {
            height: 220px;
            margin-bottom: 40px;
        }

        #editorFull {
            height: 350px;
            margin-bottom: 40px;
        }

        .table-btn {
            padding: 8px 14px;
            margin-bottom: 10px;
            background: #2f5b8a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button[type="submit"] {
            padding: 10px 20px;
            background: #1E3A5F;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .ql-editor {
            min-height: 150px;
        }

    </style>
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container">

    <h2>Добавить новость</h2>

    <form th:action="@{/admin/news/save}"
          method="post"
          onsubmit="prepareData()">

        <input type="hidden"
               name="_csrf"
               th:value="${_csrf.token}">

        <!-- Заголовок -->
        <input type="text"
               name="title"
               placeholder="Заголовок"
               required>

        <!-- SHORT TEXT -->

        <input type="hidden"
               name="shortText"
               id="shortTextHidden">

        <label class="editor-label">
            Краткий текст:
        </label>

        <button type="button"
                class="table-btn"
                id="insert-table-short">
            ➕ Вставить таблицу
        </button>

        <!-- ВАЖНО: НЕ ПУСТОЙ DIV -->
        <div id="editorShort">
            <p><br></p>
        </div>

        <!-- FULL TEXT -->

        <input type="hidden"
               name="fullText"
               id="fullTextHidden">

        <label class="editor-label">
            Полный текст:
        </label>

        <button type="button"
                class="table-btn"
                id="insert-table-full">
            ➕ Вставить таблицу
        </button>

        <!-- ВАЖНО: НЕ ПУСТОЙ DIV -->
        <div id="editorFull">
            <p><br></p>
        </div>

        <button type="submit">
            💾 Сохранить
        </button>

    </form>

</div>

<!-- QUILL -->
<script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>

<!-- KATEX -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<!-- BETTER TABLE -->
<script src="https://unpkg.com/quill-better-table@1.2.4/dist/quill-better-table.js"></script>

<script>

    /*
    ============================================
    РЕГИСТРАЦИЯ МОДУЛЯ
    ============================================
    */

    Quill.register({
        'modules/better-table': quillBetterTable
    }, true);

    /*
    ============================================
    TOOLBAR
    ============================================
    */

    const toolbarOptions = [

        [{ header: [1, 2, 3, false] }],

        ['bold', 'italic', 'underline', 'strike'],

        [{ color: [] }, { background: [] }],

        [{ list: 'ordered' }, { list: 'bullet' }],

        [{ align: [] }],

        ['blockquote', 'code-block'],

        ['link', 'image', 'video', 'formula'],

        ['clean']
    ];

    /*
    ============================================
    CONFIG
    ============================================
    */

    function makeConfig() {

        return {

            theme: 'snow',

            modules: {

                toolbar: toolbarOptions,

                'better-table': {

                    operationMenu: {

                        items: {

                            insertColumnRight: {
                                text: 'Добавить столбец справа'
                            },

                            insertColumnLeft: {
                                text: 'Добавить столбец слева'
                            },

                            insertRowUp: {
                                text: 'Добавить строку выше'
                            },

                            insertRowDown: {
                                text: 'Добавить строку ниже'
                            },

                            mergeCells: {
                                text: 'Объединить ячейки'
                            },

                            unmergeCells: {
                                text: 'Разъединить ячейки'
                            },

                            deleteColumn: {
                                text: 'Удалить столбец'
                            },

                            deleteRow: {
                                text: 'Удалить строку'
                            },

                            deleteTable: {
                                text: 'Удалить таблицу'
                            }
                        }
                    }
                }
            }
        };
    }

    /*
    ============================================
    СОЗДАНИЕ РЕДАКТОРОВ
    ============================================
    */

    const shortQuill = new Quill(
        '#editorShort',
        makeConfig()
    );

    const fullQuill = new Quill(
        '#editorFull',
        makeConfig()
    );

    /*
    ============================================
    КРИТИЧЕСКИ ВАЖНО:
    УСТАНОВКА CURSOR
    ============================================
    */

    shortQuill.setSelection(0, 0);
    fullQuill.setSelection(0, 0);

    /*
    ============================================
    ВСТАВКА ТАБЛИЦЫ SHORT
    ============================================
    */

    document
        .getElementById('insert-table-short')
        .addEventListener('click', function () {

            shortQuill.focus();

            shortQuill.setSelection(
                shortQuill.getLength(),
                0
            );

            const tableModule =
                shortQuill.getModule('better-table');

            tableModule.insertTable(3, 3);
        });

    /*
    ============================================
    ВСТАВКА ТАБЛИЦЫ FULL
    ============================================
    */

    document
        .getElementById('insert-table-full')
        .addEventListener('click', function () {

            fullQuill.focus();

            fullQuill.setSelection(
                fullQuill.getLength(),
                0
            );

            const tableModule =
                fullQuill.getModule('better-table');

            tableModule.insertTable(3, 3);
        });

    /*
    ============================================
    СОХРАНЕНИЕ HTML
    ============================================
    */

    function prepareData() {

        document.getElementById('shortTextHidden').value =
            shortQuill.root.innerHTML;

        document.getElementById('fullTextHidden').value =
            fullQuill.root.innerHTML;
    }

</script>

</body>
</html>
