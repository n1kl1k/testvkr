<!-- ========================================================= -->
<!-- ================= ДОБАВЛЕНИЕ НОВОСТИ ==================== -->
<!-- ========================================================= -->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Добавить новость</title>

    <!-- QUILL -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"
          rel="stylesheet">

    <!-- KATEX -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>

        body {
            background: #446693;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            background: white;
            max-width: 1100px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 25px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .editor-label {
            display: block;
            margin-top: 25px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #editorShort {
            height: 300px;
            margin-bottom: 40px;
        }

        #editorFull {
            height: 500px;
            margin-bottom: 40px;
        }

        .ql-editor {
            min-height: 250px;
            font-size: 16px;
        }

        button[type="submit"] {

            padding: 12px 20px;
            background: #1E3A5F;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .table-controls {

            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .table-controls input {

            width: 90px;
            padding: 8px;
        }

        .table-controls button {

            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: #2f5b8a;
            color: white;
            cursor: pointer;
        }

        table {

            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        td, th {

            border: 1px solid #999;
            padding: 10px;
            min-width: 100px;
        }

    </style>

</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container">

    <h2>Добавить новость</h2>

    <form th:action="@{/admin/news/save}"
          method="post"
          onsubmit="prepareData()">

        <input type="hidden"
               name="_csrf"
               th:value="${_csrf.token}">

        <!-- TITLE -->
        <input type="text"
               name="title"
               placeholder="Заголовок"
               required>

        <!-- SHORT -->

        <input type="hidden"
               name="shortText"
               id="shortTextHidden">

        <label class="editor-label">
            Краткий текст:
        </label>

        <div class="table-controls">

            <input type="number"
                   id="rowsShort"
                   min="1"
                   value="3"
                   placeholder="Строки">

            <input type="number"
                   id="colsShort"
                   min="1"
                   value="3"
                   placeholder="Столбцы">

            <button type="button"
                    onclick="insertTable(shortQuill, 'rowsShort', 'colsShort')">
                 Таблица
            </button>
            <button type="button"
                onclick="deleteSelectedTable(shortQuill)">
                 Удалить таблицу
            </button>

        </div>

        <div id="editorShort"></div>

        <!-- FULL -->

        <input type="hidden"
               name="fullText"
               id="fullTextHidden">

        <label class="editor-label">
            Полный текст:
        </label>

        <div class="table-controls">

            <input type="number"
                   id="rowsFull"
                   min="1"
                   value="3">

            <input type="number"
                   id="colsFull"
                   min="1"
                   value="3">

            <button type="button"
                    onclick="insertTable(fullQuill, 'rowsFull', 'colsFull')">
                 Таблица
            </button>
            <button type="button"
                onclick="deleteSelectedTable(fullQuill)">
                 Удалить таблицу
            </button>

        </div>

        <div id="editorFull"></div>

        <button type="submit">
            💾 Сохранить
        </button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<script>

    const toolbarOptions = [

        [{ header: [1, 2, 3, 4, 5, 6, false] }],

        [{ font: [] }],

        [{ size: ['small', false, 'large', 'huge'] }],

        ['bold', 'italic', 'underline', 'strike'],

        [{ color: [] }, { background: [] }],

        [{ script: 'sub' }, { script: 'super' }],

        ['blockquote', 'code-block'],

        [{ list: 'ordered' }, { list: 'bullet' }],

        [{ indent: '-1' }, { indent: '+1' }],

        [{ align: [] }],

        ['link', 'image', 'video', 'formula'],

        ['clean']
    ];

    function makeConfig() {

        return {

            theme: 'snow',

            modules: {
                toolbar: toolbarOptions
            }
        };
    }

    const shortQuill =
        new Quill('#editorShort', makeConfig());

    const fullQuill =
        new Quill('#editorFull', makeConfig());

    function insertTable(quill, rowsId, colsId) {

        const rows =
            parseInt(document.getElementById(rowsId).value);

        const cols =
            parseInt(document.getElementById(colsId).value);

        if (!rows || !cols) {

            alert('Введите количество строк и столбцов');
            return;
        }

        const range =
            quill.getSelection(true);

        let tableHtml =
            '<table border="1" style="border-collapse: collapse; width: 100%;">';

        for (let r = 0; r < rows; r++) {

            tableHtml += '<tr>';

            for (let c = 0; c < cols; c++) {

                tableHtml +=
                    '<td contenteditable="true">' +
                    '&nbsp;' +
                    '</td>';
            }

            tableHtml += '</tr>';
        }

        tableHtml += '</table><p><br></p>';

        quill.clipboard.dangerouslyPasteHTML(
            range.index,
            tableHtml
        );
    }

    function prepareData() {

        document.getElementById('shortTextHidden').value =
            shortQuill.root.innerHTML;

        document.getElementById('fullTextHidden').value =
            fullQuill.root.innerHTML;
    }

function deleteSelectedTable(quill) {

    const selection =
        window.getSelection();

    if (!selection.rangeCount) {

        alert('Выделите таблицу');
        return;
    }

    let node =
        selection.anchorNode;

    while (node) {

        if (node.tagName === 'TABLE') {

            node.remove();
            return;
        }

        node = node.parentNode;
    }

    alert('Курсор должен находиться внутри таблицы');
}
</script>

</body>
</html>
