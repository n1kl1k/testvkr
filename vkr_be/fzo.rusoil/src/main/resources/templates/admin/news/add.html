<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Добавить новость</title>

    <!-- QUILL 2 -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"
          rel="stylesheet">

    <!-- KATEX -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>

        body {
            background: #446693;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            background: white;
            max-width: 1000px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 25px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .editor-label {
            display: block;
            margin-top: 25px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #editorShort {
            height: 250px;
            margin-bottom: 40px;
        }

        #editorFull {
            height: 450px;
            margin-bottom: 40px;
        }

        .ql-editor {
            min-height: 200px;
            font-size: 16px;
        }

        button[type="submit"] {

            padding: 12px 20px;
            background: #1E3A5F;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .toolbar-buttons {
            margin-bottom: 10px;
        }

        .toolbar-buttons button {

            margin-right: 10px;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: #2f5b8a;
            color: white;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container">

    <h2>Добавить новость</h2>

    <form th:action="@{/admin/news/save}"
          method="post"
          onsubmit="prepareData()">

        <!-- CSRF -->
        <input type="hidden"
               name="_csrf"
               th:value="${_csrf.token}">

        <!-- TITLE -->
        <input type="text"
               name="title"
               placeholder="Заголовок"
               required>

        <!-- SHORT TEXT -->
        <input type="hidden"
               name="shortText"
               id="shortTextHidden">

        <label class="editor-label">
            Краткий текст:
        </label>

        <div class="toolbar-buttons">
            <button type="button"
                    onclick="insertTable(shortQuill)">
                ➕ Таблица
            </button>
        </div>

        <div id="editorShort"></div>

        <!-- FULL TEXT -->
        <input type="hidden"
               name="fullText"
               id="fullTextHidden">

        <label class="editor-label">
            Полный текст:
        </label>

        <div class="toolbar-buttons">
            <button type="button"
                    onclick="insertTable(fullQuill)">
                ➕ Таблица
            </button>
        </div>

        <div id="editorFull"></div>

        <button type="submit">
            💾 Сохранить
        </button>

    </form>

</div>

<!-- QUILL -->
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

<!-- KATEX -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<script>

    /*
    ============================================
    TOOLBAR
    ============================================
    */

    const toolbarOptions = [

        [{ header: [1, 2, 3, 4, 5, 6, false] }],

        [{ font: [] }],

        [{ size: ['small', false, 'large', 'huge'] }],

        ['bold', 'italic', 'underline', 'strike'],

        [{ color: [] }, { background: [] }],

        [{ script: 'sub' }, { script: 'super' }],

        ['blockquote', 'code-block'],

        [{ list: 'ordered' }, { list: 'bullet' }],

        [{ indent: '-1' }, { indent: '+1' }],

        [{ align: [] }],

        ['link', 'image', 'video', 'formula'],

        ['clean']
    ];

    /*
    ============================================
    CONFIG
    ============================================
    */

    function makeConfig() {

        return {

            theme: 'snow',

            modules: {
                toolbar: toolbarOptions
            }
        };
    }

    /*
    ============================================
    EDITORS
    ============================================
    */

    const shortQuill = new Quill(
        '#editorShort',
        makeConfig()
    );

    const fullQuill = new Quill(
        '#editorFull',
        makeConfig()
    );

    /*
    ============================================
    TABLE INSERT
    ============================================
    */

    function insertTable(quill) {

        const range =
            quill.getSelection(true);

        const rows = 3;
        const cols = 3;

        let tableHtml = '<table border="1" style="border-collapse: collapse; width: 100%;">';

        for (let r = 0; r < rows; r++) {

            tableHtml += '<tr>';

            for (let c = 0; c < cols; c++) {

                tableHtml +=
                    '<td style="padding:8px;">&nbsp;</td>';
            }

            tableHtml += '</tr>';
        }

        tableHtml += '</table><p><br></p>';

        quill.clipboard.dangerouslyPasteHTML(
            range.index,
            tableHtml
        );
    }

    /*
    ============================================
    SAVE HTML
    ============================================
    */

    function prepareData() {

        document.getElementById('shortTextHidden').value =
            shortQuill.root.innerHTML;

        document.getElementById('fullTextHidden').value =
            fullQuill.root.innerHTML;
    }

</script>

</body>
</html>
