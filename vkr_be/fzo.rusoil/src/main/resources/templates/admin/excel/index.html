<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Календарные графики</title>
    <link th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1E3A5F, #2c4a76);
            min-height: 100vh;
        }
        .file-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 10px;
            border-left: 4px solid #dee2e6;
        }
        .file-card.is-active {
            border-left-color: #198754;
        }
        .file-meta { flex: 1; }
        .file-name {
            font-weight: 600;
            font-size: 15px;
            color: #1E3A5F;
            margin: 0 0 3px;
        }
        .file-desc {
            font-size: 13px;
            color: #666;
            margin: 0 0 2px;
        }
        .file-date {
            font-size: 12px;
            color: #999;
            margin: 0;
        }
        .badge-active {
            display: inline-block;
            background: #d1fae5;
            color: #065f46;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            margin-left: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 style="color:white;">Календарные графики</h3>
        <a href="/admin/excel/upload" class="btn btn-primary">+ Загрузить новый</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(files)}">
        <div class="file-card">
            <p class="text-muted mb-0">Файлы не загружены</p>
        </div>
    </div>

    <div th:each="file : ${files}"
         th:classappend="${file.active} ? ' is-active'"
         class="file-card">

        <div class="file-meta">
            <p class="file-name">
                <span th:text="${file.originalFileName}"></span>
                <span th:if="${file.active}" class="badge-active">● Активный</span>
            </p>
            <p class="file-desc"
               th:text="${file.description != null and !file.description.isEmpty()} ? ${file.description} : 'Без описания'">
            </p>
            <p class="file-date"
               th:text="${#temporals.format(file.uploadDate, 'dd.MM.yyyy HH:mm')}">
            </p>
        </div>

        <div class="d-flex gap-2 flex-shrink-0">
            <form th:if="${!file.active}"
                  th:action="@{/admin/excel/activate/{id}(id=${file.id})}"
                  method="post">
                <button type="submit" class="btn btn-success btn-sm">Сделать активным</button>
            </form>

            <form th:action="@{/admin/excel/delete/{id}(id=${file.id})}"
                  method="post"
                  onsubmit="return confirm('Удалить файл «' + this.dataset.name + '»?')"
                  th:data-name="${file.originalFileName}">
                <button type="submit" class="btn btn-outline-danger btn-sm">Удалить</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
