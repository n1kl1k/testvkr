<script>
function uploadExcel() {
    const file = document.getElementById('excelFileInput').files[0];
    if (!file) { alert('Выберите файл'); return; }

    // Проверяем расширение
    if (!file.name.endsWith('.xls') && !file.name.endsWith('.xlsx')) {
        alert('Только .xls или .xlsx файлы');
        return;
    }

    const formData = new FormData();
    formData.append('file', file);

    fetch('/api/excel/upload', { method: 'POST', body: formData })
        .then(res => res.text())
        .then(filename => {
            document.getElementById('excelUploadResult').innerHTML =
                `<div class="alert alert-success mt-2">✅ Загружен файл: <b>${filename}</b></div>`;
        })
        .catch(() => {
            document.getElementById('excelUploadResult').innerHTML =
                `<div class="alert alert-danger mt-2">Ошибка загрузки</div>`;
        });
}
</script>
