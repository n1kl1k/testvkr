<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Excel файлы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #1E3A5F, #2c4a76); min-height:100vh;">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 style="color:white;"> Календарный график</h3>
        <a href="/admin/excel/upload" class="btn btn-primary"> Загрузить новый</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card p-4">
        <div th:if="${currentFile != null}">
            <p> Текущий файл: <b th:text="${currentFile}"></b></p>
            <a href="/admin/excel/delete"
               class="btn btn-danger"
               onclick="return confirm('Удалить файл с сайта?')"> Удалить</a>
        </div>
        <div th:if="${currentFile == null}">
            <p class="text-muted">Файл не загружен</p>
            <a href="/admin/excel/upload" class="btn btn-primary">Загрузить файл</a>
        </div>
    </div>
</div>
</body>
</html>
